# Sample nginx server block for FOD Tags Aggregator.
#
# This is a REFERENCE ONLY — adding this block to the VM's nginx config is
# an ops/deploy step performed outside this repo. The app itself owns no
# proxy or TLS configuration: it just listens on plain HTTP on $PORT
# (default 3000, see .env.example / specs/12-Architecture.md §12.9) and
# trusts the `X-Forwarded-*` / `Host` headers nginx sets below (Auth.js is
# configured with `trustHost: true` for this reason — see
# specs/12-Architecture.md §12.2).
#
# The VM already runs nginx for other apps and already terminates TLS
# (e.g. via an existing certbot-managed certificate) — this block assumes
# that existing TLS setup and only adds the reverse-proxy piece for this
# app's hostname. Adjust server_name / certificate paths / PORT to match
# the real deployment.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fodtags.example.org;

    # TLS certs: managed by the VM's existing nginx/certbot setup — paths
    # below are illustrative only.
    ssl_certificate     /etc/letsencrypt/live/fodtags.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fodtags.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000; # must match the app's PORT env var

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Websocket/upgrade support (Next.js dev HMR is irrelevant in prod,
        # but harmless to keep for any future streaming use).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Optional: redirect plain HTTP to HTTPS (skip if the VM already has a
# shared redirect block for all vhosts).
server {
    listen 80;
    listen [::]:80;
    server_name fodtags.example.org;
    return 301 https://$host$request_uri;
}
