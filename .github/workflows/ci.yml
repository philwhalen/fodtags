name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Dummy-but-valid config env for the whole job. There is no committed
    # `.env` (it's gitignored — see .gitignore / .env.example): locally,
    # `next build`/`vitest` pick up the developer's own `.env`, but CI has
    # none, and both `npm test` AND `npm run build` import the
    # `src/server/config` module graph at import time (the health route /
    # public page / db client all resolve through it during Next's
    # "Collecting page data" step, and every test file transitively
    # through the pipeline/db modules) — `src/server/config/index.ts`
    # Zod-validates `process.env` and calls `process.exit(1)` if
    # `AUTH_SECRET` (>=32 chars), `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`,
    # `BOOTSTRAP_DIRECTOR_EMAIL`, or `DATA_DIR` are missing. Without this
    # block, both `test` and `build` would fail fast in CI even though they
    # pass locally (only because the local `.env` happens to satisfy the
    # schema).
    env:
      DATA_DIR: ${{ runner.temp }}/fodtags-data
      AUTH_SECRET: ci-dummy-auth-secret-32-characters-minimum-000
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      BOOTSTRAP_DIRECTOR_EMAIL: director@example.com
      APP_TIMEZONE: America/New_York
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
